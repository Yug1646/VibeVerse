<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>VibeVerse | Login</title>
  </head>
  <body>
    <main>
      <form action="">
        <h2>Login</h2>

        <img class="form-logo" src="images/user.png" alt="user-logo" width="20px">
        <label for="user-id">Enter User Id</label>
        <input type="text" name="user-id" id="user-id" />

        <img class="form-logo" src="images/password.png" alt="user-logo" width="20px">
        <label for="user-password">Enter Password</label>
        <input type="password" name="user-password" id="user-password" />

        <button class="btn login-btn">Login</button>
      </form>
    </main>
  </body>
</html>
